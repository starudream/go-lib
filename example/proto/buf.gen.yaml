# yaml-language-server: $schema=https://json.schemastore.org/buf.gen.json

version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen_go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: gen_go
    opt:
      - paths=source_relative
  - remote: buf.build/community/mfridman-go-json
    out: gen_go
    opt:
      - paths=source_relative
      - enums_as_ints=true
      - emit_defaults=true
      - allow_unknown=true
  - remote: buf.build/bufbuild/validate-go
    out: gen_go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen_go
    opt:
      - paths=source_relative

  - remote: buf.build/grpc-ecosystem/openapiv2
    out: gen_doc
    opt:
      - allow_merge=true
      - include_package_in_tags=true
      - fqn_for_openapi_name=true
      - use_go_templates=true
      - disable_default_errors=true
      - enums_as_ints=true
      - preserve_rpc_order=true
