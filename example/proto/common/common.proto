syntax = "proto3";

package api.common;

import public "google/api/field_behavior.proto";
import public "google/api/httpbody.proto";
import public "google/protobuf/any.proto";
import public "google/protobuf/duration.proto";
import public "google/protobuf/empty.proto";
import public "google/protobuf/field_mask.proto";
import public "google/protobuf/struct.proto";
import public "google/protobuf/timestamp.proto";
import public "google/protobuf/wrappers.proto";
import public "google/rpc/status.proto";

option go_package = "github.com/starudream/go-lib/example/v2/api/common";

message Id {
  string id = 1;
}
